<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>Код подтверждения MyHoroAI</title>
</head>

<body style="margin:0; padding:0; background-color:#1e0342; font-family: Arial, sans-serif; color:#ffffff;">
    <table border="0" cellpadding="0" cellspacing="0" width="100%">
        <tr>
            <td align="center" style="padding:0; background-color: #1e0342;">
                <table border="0" cellpadding="0" cellspacing="0" width="600"
                    style="max-width:600px; background:linear-gradient(90deg, #2a0a5a 0%, #3c1a7a 100%); border:2px solid; border-radius:12px; overflow:hidden;">
                    <tr>
                        <td align="center"
                            style="padding:30px 20px; background:linear-gradient(90deg, #eb57ea 0%, #46abf9 100%);">
                            <h1 style="margin:0; font-size:28px; font-weight:bold; color:#fff;">MyHoroAI</h1>
                        </td>
                    </tr>
                    <tr>
                        <td align="center" style="padding:40px 30px;">
                            <h2 style="font-size:22px; margin:0 0 15px 0; color:#ffffff;">{{ text }}</h2>
                            <p style="font-size:16px; margin:0 0 25px 0; color:#b98cf4;">
                                Введите его на сайте для подтверждения вашей регистрации.
                            </p>
                            <div
                                style="display:inline-block; padding:15px 25px; border-radius:12px; background:linear-gradient(90deg, #eb57ea 0%, #46abf9 100%); font-size:24px; font-weight:bold; letter-spacing:2px; color:#fff;">
                                {{ code }}
                            </div>
                        </td>
                    </tr>
                    <tr>
                        <td align="center" style="padding:20px; font-size:12px; color:#aaa;">
                            <p style="margin:0; color:#aaa;">Это письмо отправлено автоматически. Пожалуйста, не
                                отвечайте на него.</p>
                            <p style="margin:5px 0 0 0; color:#555;">© 2025 MyHooAI</p>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>

</html>
