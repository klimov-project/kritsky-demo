services:
  db:
    image: postgres:16-alpine
    restart: always
    env_file:
      - ./.env
    environment:
      POSTGRES_DB: ${DB_NAME:-kritsky}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-kritsky}"]
      interval: 3s
      timeout: 3s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - proxy-net

  redis:
    image: redis:7-alpine
    restart: always
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10
    volumes:
      - redis_data:/data
    networks:
      - proxy-net

  redis-cache:
    image: redis:7-alpine 
    restart: unless-stopped
    volumes:
      - redis_cache_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - proxy-net

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: always
    env_file:
      - ./.env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-kritsky}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 5s
      timeout: 5s
      retries: 10
    expose:
      - "8000"
    networks:
      - proxy-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      NITRO_STORAGE_CACHE: ${NITRO_STORAGE_CACHE}
      NUXT_API_BACKEND_BASE: ${NUXT_API_BACKEND_BASE}
      NUXT_API_BACKEND_URL: ${NUXT_API_BACKEND_URL}
      NUXT_PUBLIC_API_BASE: ${NUXT_PUBLIC_API_BASE}
      NUXT_SESSION_PASSWORD: ${NUXT_SESSION_PASSWORD}
    restart: always
    depends_on:
      backend:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
    expose:
      - "3000"
    networks:
      - proxy-net

  adminka:
    build:
      context: ./adminka
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_BASE_PATH: /adminka
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://backend:8000}
        NEXT_PUBLIC_SUPPORT_EMAIL: ${NEXT_PUBLIC_SUPPORT_EMAIL:-admin@kritsky.local}
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://backend:8000}
      NEXT_PUBLIC_SUPPORT_EMAIL: ${NEXT_PUBLIC_SUPPORT_EMAIL:-admin@kritsky.local}
    restart: always
    depends_on:
      backend:
        condition: service_healthy
    expose:
      - "3000"
    networks:
      - proxy-net

volumes:
  redis_cache_data:
  postgres_data:
  redis_data:
  
networks:
  proxy-net:
    external: true