server {
    listen 80;
    server_name ege.kritsky.academy;

    # Docker DNS resolver
    resolver 127.0.0.11 valid=30s;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name ege.kritsky.academy;

    # Docker DNS resolver
    resolver 127.0.0.11 valid=30s;

    ssl_certificate /etc/letsencrypt/live/ege.kritsky.academy/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ege.kritsky.academy/privkey.pem;

    # Proxy API requests to backend
    location /api/ {
        set $backend_upstream backend;
        proxy_pass http://$backend_upstream:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy all other requests to frontend
    location / {
        set $frontend_upstream frontend;
        proxy_pass http://$frontend_upstream:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
